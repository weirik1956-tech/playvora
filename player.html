<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player | PLAYVORA</title>
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17112b;--panel:#231a3d;--panel2:#2d2250;--line:#3a2d63;--cream:#f3ecff;--mute:#a99dcb;--accent:#ff5a7a;--accent-d:#ff7690;--on-accent:#1a0b14;--teal:#2ee6c5}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.55 "DM Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px;width:100%}
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px;max-width:980px}
.top a:not(.btn){color:var(--mute);font-size:14px}.top a:not(.btn):hover{color:var(--cream)}
.top .sp{flex:1}
.logo{font:800 22px "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:1px;color:var(--cream)!important}
.icon{background:var(--panel);border:1px solid var(--line);color:var(--cream);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0 0}
.card h2{margin:0 0 12px;font:800 18px "Bricolage Grotesque","Segoe UI",sans-serif}
.head{display:flex;gap:18px;align-items:center}
.av{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 32px "Bricolage Grotesque","Segoe UI",sans-serif;flex:none}
.head h1{margin:0;font:800 30px "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.5px;line-height:1.1;word-break:break-word}
.sub{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mute)}
.pill b{color:var(--cream)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mute)}
.bar{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bio{margin:16px 0 0;color:var(--cream);white-space:pre-wrap;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--panel2);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:800 26px "Bricolage Grotesque","Segoe UI",sans-serif}
.stat span{color:var(--mute);font-size:13px}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ach div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ach b{display:block}.ach small{color:var(--mute)}
.note{background:var(--panel2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--mute);margin-top:18px}
.btn{display:inline-block;border:0;border-radius:10px;padding:8px 16px;background:var(--accent);color:var(--on-accent);font:700 14px "DM Sans",sans-serif;cursor:pointer}
.btn:hover{background:var(--accent-d)}
.btn.alt{background:var(--panel2);color:var(--cream);border:1px solid var(--line)}
footer{margin-top:auto;border-top:1px solid var(--line);padding:22px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:980px}
</style>
<script src="js/bell.js" defer></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html">PLAYVORA</a>
  <a href="index.html#explore">Explore</a><a href="challenges.html">Challenges</a><a href="leaderboard.html">Leaderboard</a>
  <span class="sp"></span>
  <button class="icon" id="tt" aria-label="Toggle light or dark mode" title="Toggle theme">&#9680;</button>
  <a class="btn" id="who" data-base="" href="login.html">Sign in</a>
</div></header>

<main class="wrap" id="main"><div class="note">Loading player...</div></main>
<footer><div class="wrap"><span>&copy; 2026 PLAYVORA</span><span>Discover. Play. Compete.</span></div></footer>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GAMES={tetris:"Tetris","space-shooter":"Space Shooter",snake:"Snake","2048":"2048",memory:"Memory Cards",minesweeper:"Minesweeper",breakout:"Breakout"};
const DOT={online:"#2ee6c5",away:"#ffd23f",busy:"#ff5a7a"};
$("tt").onclick=()=>PS.toggle();
function msg(t){$("main").innerHTML='<div class="note">'+t+'</div>'}

(async()=>{
  const name=(new URLSearchParams(location.search).get("u")||"").trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(name))return msg('Player not found. <a href="leaderboard.html" style="text-decoration:underline">Browse the leaderboard</a>.');
  if(!window.psdb)return msg("Could not reach PLAYVORA. Check your connection and refresh.");
  PSAuth.nav($("who"));
  const viewer=await PSAuth.user();
  const pr=await psdb.from("profiles").select("id,username,display_name,level,xp,is_public,created_at").eq("username",name).maybeSingle();
  if(pr.error)return msg("Player pages need the latest database setup. Run <b>supabase-upgrade.sql</b> and <b>supabase-players.sql</b> in Supabase, then refresh.");
  const p=pr.data;
  if(!p)return msg('No player called <b>'+esc(name)+'</b>. <a href="leaderboard.html" style="text-decoration:underline">Browse the leaderboard</a>.');
  document.title=p.username+" | PLAYVORA";
  const mine=viewer&&viewer.id===p.id;
  const [dr,sr,ar,ur]=await Promise.all([
    psdb.from("profile_details").select("bio,status,favourite_genres").eq("user_id",p.id).maybeSingle(),
    psdb.from("scores").select("game,score").eq("user_id",p.id),
    psdb.from("achievements").select("id,name,description,xp").order("xp"),
    psdb.from("user_achievements").select("achievement_id").eq("user_id",p.id)]);
  const d=dr.data,visible=p.is_public||mine;
  const best={},plays={};
  (sr.data||[]).forEach(r=>{best[r.game]=Math.max(best[r.game]||0,r.score);plays[r.game]=(plays[r.game]||0)+1});
  const into=(p.xp||0)%200,shown=p.display_name||p.username;
  let h='<div class="card"><div class="head"><div class="av" aria-hidden="true">'+esc(p.username[0].toUpperCase())+'</div><div><h1>'+esc(shown)+'</h1><div class="sub">@'+esc(p.username)+'</div></div></div>';
  h+='<div class="row"><span class="pill">Level <b>'+(p.level||1)+'</b></span><span class="pill"><b>'+(p.xp||0)+'</b> XP</span>';
  if(visible&&d&&d.status&&d.status!=="invisible")h+='<span class="pill"><span class="dot" style="background:'+(DOT[d.status]||"var(--mute)")+'"></span>'+esc(d.status[0].toUpperCase()+d.status.slice(1))+'</span>';
  h+='<span class="pill">Joined '+new Date(p.created_at).toLocaleDateString()+'</span></div>';
  h+='<div class="bar"><i style="width:'+(into/2)+'%"></i></div>';
  if(visible&&d&&d.bio)h+='<p class="bio">'+esc(d.bio)+'</p>';
  if(visible&&d&&d.favourite_genres&&d.favourite_genres.length)h+='<div class="row">'+d.favourite_genres.map(g=>'<span class="pill">'+esc(g)+'</span>').join("")+'</div>';
  if(mine)h+='<div class="row" style="margin-top:16px"><a class="btn alt" href="settings.html#profile">Edit profile</a></div>';
  else if(viewer)h+='<div class="row" style="margin-top:16px"><button class="btn alt" id="addf">Add friend</button><span id="fmsg" style="color:var(--mute);font-size:14px"></span></div>';
  h+='</div>';
  if(!p.is_public)h+='<div class="note">'+(mine?'Your profile is private, so only you can see your bio, status, genres and achievements. You can change this in Settings.':'This player keeps their profile private. Their level and scores are still visible.')+'</div>';
  h+='<div class="card"><h2>Best scores</h2><div class="stats">'+Object.keys(GAMES).map(k=>'<div class="stat"><b>'+(best[k]||"-")+'</b><span>'+GAMES[k]+(plays[k]?" &middot; "+plays[k]+" played":"")+'</span></div>').join("")+'</div></div>';
  if(visible&&ar.data&&ar.data.length){
    const got=new Set((ur.data||[]).map(r=>r.achievement_id)),mineList=ar.data.filter(a=>got.has(a.id));
    h+='<div class="card"><h2>Achievements</h2>'+(mineList.length?'<div class="ach">'+mineList.map(a=>'<div><b>'+esc(a.name)+' &#10003;</b><small>'+esc(a.description)+' &middot; '+a.xp+' XP</small></div>').join("")+'</div>':'<p class="sub" style="margin:0">No achievements unlocked yet.</p>')+'</div>'}
  $("main").innerHTML=h;
  if($("addf"))$("addf").onclick=async()=>{
    $("addf").disabled=true;
    const r=await psdb.rpc("send_friend_request",{p_username:p.username});
    $("fmsg").textContent=r.error?r.error.message:(r.data==="accepted"?"You are now friends.":"Request sent.");
    if(r.error)$("addf").disabled=false}})();
</script>
</body>
</html>
